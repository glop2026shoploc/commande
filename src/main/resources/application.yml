server:
  port: 8084

spring:
  application:
    name: commande
    
  datasource:
    url: jdbc:postgresql://localhost:5435/commande
    username: commande
    password: commande
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      catalogue:
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      catalogue:
        maxAttempts: 2
        waitDuration: 500ms

server:
  port: 8084

spring:
  application:
    name: commande

  datasource:
    url: jdbc:postgresql://localhost:5435/Commande
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/